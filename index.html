<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Collection | Desserts</title>
    <!-- นำเข้าฟอนต์ Serif เรียบหรู (Cormorant Garamond) และ Sans-Serif (Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
   
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation -->
    <header>
        <div class="brand-logo">Sweet Collection</div>
    </header>

    <!-- Sub Navigation Menu -->
    <nav class="sub-nav">
        <a href="#home" class="active">HOME</a>
        <a href="#story">STORY</a>
        <a href="#about">ABOUT</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section" id="home">
        <div class="hero-content">
            <h1 class="hero-title">We tell stories <br>with desserts</h1>
            <a href="#desserts" class="btn-pill">View More</a>
        </div>

        <div class="hero-image-wrapper">
            <img src="img/patisserie.jpg" class="hero-img">
        </div>

        <div class="vertical-text">SWEET COLLECTION</div>
    </section>

    <div class="divider-line"></div>

    <!-- Product Showcase Section (Seasons Finest) -->
    <section class="products-section" id="CAKES">
        <h2 class="section-title">Season’s Finest</h2>
        
        <div class="category-tabs">
            <span class="tab active">CAKES</span>
            <span class="tab">DESSERTS</span>
        </div>

        <div class="product-grid">
            <!-- Product 1 -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="img/mmatcha.jpg" alt="In Bloom Tart">
                </div>
                <h3 class="product-name">Matcha Roll Cake</h3>
            </div>

            <!-- Product 2 -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="https://i.pinimg.com/736x/5f/f2/ce/5ff2ce67ec4c7a013fd4600e0cff85b7.jpg" alt="Vintage Fleur Cake">
                </div>
                <h3 class="product-name">Chocolate Cake</h3>
            </div>

            <!-- Product 3 -->
            <div class="product-card">
                <div class="product-img-box">
                    <img src="https://i.pinimg.com/736x/86/87/a5/8687a52fd62116399e0d0eeaf65bb18d.jpg" alt="Burnished Blossom">
                </div>
                <h3 class="product-name">Matcha Pudding</h3>
            </div>
        </div>
    </section>

    <section class="story-banner-section" id="story">
        <div class="banner-grid">
            <div class="banner-card bg-olive">
                    <img src="https://i.pinimg.com/736x/4f/92/40/4f92405ae8d29cb4a1e951d58240e212.jpg" alt="Arch Cake">
            </div>

            <!-- Box 2: Warm Brown Background with Full Image -->
            <div class="banner-card bg-terracotta">
                <img src="img/wakaranai.jpg.jpg" alt="Craft Process" class="full-img">
                <div class="vertical-text-overlay">SWEET COLLECTION</div>
            </div>

            <!-- Box 3: Light Background Image -->
            <div class="banner-card bg-cream">
                <img src="https://i.pinimg.com/736x/9e/b3/c4/9eb3c485abae6757771cdd5cc50c05b8.jpg" alt="Bakery Table" class="full-img">
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SWEET COLLECTION. All rights reserved.</p>
    </footer>

</body>
</html>
